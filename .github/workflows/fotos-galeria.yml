name: Fotos - galeria de páginas oficiais
on: workflow_dispatch
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - run: python3 tools/fotos/galeria.py
      - run: |
          git config user.name "robo-omg"; git config user.email "robo@ohmygirl.com.br"
          git add tools/fotos/galeria tools/fotos/galeria_urls.json
          git commit -m "Fotos: galeria das páginas oficiais" && git pull --rebase && git push || echo nada
