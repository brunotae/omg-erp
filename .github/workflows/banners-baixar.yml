name: Banners - baixar imagens das marcas
on:
  push:
    branches: [main]
    paths: ['tools/banners/baixar.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/banners/baixar.py
      - run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/banners
          git commit -m "Imagens das marcas para banners" || true
          git pull --rebase origin main && git push
