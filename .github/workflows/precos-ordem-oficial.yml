name: Precos - ordem de mais vendidos da loja oficial
on:
  push:
    branches: [main]
    paths: ['tools/precos/ext/ordem_oficial.py']
  workflow_dispatch:
    inputs:
      loja: { description: 'Loja oficial (Shopify)', default: 'numbuzinus.com' }
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/precos/ext/ordem_oficial.py
        env: { LOJA: "${{ github.event.inputs.loja || 'numbuzinus.com' }}" }
      - run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/precos/ext/dados
          git commit -m "Ordem de mais vendidos da loja oficial" || true
          git pull --rebase origin main && git push
