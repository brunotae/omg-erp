name: Sondar fontes de fotos das marcas
on:
  push:
    branches: [main]
    paths: ['tools/fontes/candidatos.txt', 'tools/fontes/sondar.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fontes/sondar.py
      - name: Guardar resultado
        run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/fontes/resultado.csv
          git commit -m "Resultado da sondagem de fontes de fotos" || true
          git push
