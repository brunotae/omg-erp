name: baixar-detalhes
# Ferramenta interna: abre páginas de produto de lojas cafe24 (fabricantes coreanos), pega as imagens do produto e do detalhe e guarda no ramo imagens-tmp.
on:
  workflow_dispatch:
    inputs:
      paginas:
        description: "URLs das páginas de produto, separadas por espaço"
        required: true
      nome:
        description: "nome do pacote"
        required: false
        default: "detalhes"
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar
        env:
          PAGS: ${{ inputs.paginas }}
        run: |
          mkdir -p out
          for p in $PAGS; do
            no=$(echo "$p" | sed -n 's/.*product_no=\([0-9]*\).*/\1/p'); d="out/p$no"; mkdir -p "$d"
            curl -sSL -m 60 -A "Mozilla/5.0" -o "$d/pagina.html" "$p" || { echo "falhou pagina $p"; continue; }
            grep -oE '(src|ec-data-src)="[^"]*ecimg\.cafe24img\.com[^"]*\.(jpg|jpeg|png|gif)"' "$d/pagina.html" | sed -E 's/^[^"]*"//; s/"$//' | grep -vE '/(small|tiny|medium)/' | awk '!s[$0]++' > "$d/lista.txt"
            i=0
            while read -r u; do
              case "$u" in //*) u="https:$u";; /*) u="$(echo "$p" | sed -E 's#(https?://[^/]+).*#\1#')$u";; esac
              i=$((i+1)); n=$(printf '%03d' $i)_$(basename "${u%%\?*}")
              curl -sSL -m 90 -A "Mozilla/5.0" -e "$p" -o "$d/$n" "$u" && echo "ok $no $n $(stat -c%s "$d/$n")" || echo "falhou $u"
            done < "$d/lista.txt"
          done
      - name: Guardar no ramo imagens-tmp (fora do main)
        env:
          NOME: ${{ inputs.nome }}
          TK: ${{ github.token }}
        run: |
          cd out; git init -q -b imagens-tmp; git config user.name omg-bot; git config user.email bot@ohmygirl.com.br
          mkdir -p "../$NOME" && mv * "../$NOME"/ && mv "../$NOME" .
          git add . && git commit -qm "detalhes $NOME"
          git push -f "https://x-access-token:$TK@github.com/${{ github.repository }}.git" imagens-tmp
