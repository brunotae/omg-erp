name: Baixar fotos oficiais (marcas restantes)
on:
  push:
    branches: [main]
    paths: ['tools/marcas/sites2.csv', 'tools/marcas/baixar_fundos2.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/marcas/baixar_fundos2.py
      - name: Guardar
        run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/marcas/fundos tools/marcas/fundos2_relatorio.json
          git commit -m "Fotos oficiais candidatas (marcas restantes)" || true
          git pull --rebase origin main && git push
