name: Fotos - busca 3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - run: python3 tools/fotos/busca3.py
      - run: |
          git config user.name "robo-omg"; git config user.email "robo@ohmygirl.com.br"
          git add tools/fotos/busca3 tools/fotos/busca3_achados.json
          git commit -m "Fotos: busca 3" && git pull --rebase && git push || echo nada
