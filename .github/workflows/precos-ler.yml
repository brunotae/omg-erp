name: Precos - ler concorrentes (semanal)
# Lê o catálogo inteiro da KS e da Jini e grava no ERP (tabela conc_catalogo).
# Roda toda segunda às 05:37 (Brasília) e quando alguém clica em "Run workflow".
on:
  schedule:
    - cron: '37 8 * * 1'
  workflow_dispatch:
    inputs:
      loja:
        description: 'Só uma loja (ks ou jini). Vazio = as duas'
        required: false
        default: ''
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 tools/precos/ler_concorrentes.py ${{ inputs.loja }}
