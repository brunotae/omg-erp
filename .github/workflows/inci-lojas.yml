name: INCI das lojas oficiais
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/inci/lojas.json']
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/inci/inci_lojas.py
      - run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/inci/dados
          git commit -m "INCI das lojas oficiais" || true
          git pull --rebase origin main && git push
