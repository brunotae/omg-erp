name: Precos - sondar varejo do exterior
on:
  push:
    branches: [main]
    paths: ['tools/precos/ext/sonda_ext.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/precos/ext/sonda_ext.py
      - run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/precos/ext/sonda
          git commit -m "Sonda do varejo do exterior" || true
          git pull --rebase origin main && git push
