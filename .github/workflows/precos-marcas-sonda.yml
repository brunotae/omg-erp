name: Precos - sondar sites das marcas
on:
  push:
    branches: [main]
    paths: ['tools/precos/sondar_marcas.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/precos/sondar_marcas.py
      - run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/precos/sonda_marcas.json
          git commit -m "Sonda dos sites das marcas" || true
          git pull --rebase origin main && git push
