name: Precos - ler preço promocional (EUA oficial + Jini)
on:
  push:
    branches: [main]
    paths: ['tools/precos/ext/promo.py','tools/precos/ext/promo_urls.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/precos/ext/promo.py
      - run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/precos/ext/dados
          git commit -m "Preço promocional: leitura" || true
          git pull --rebase origin main && git push
