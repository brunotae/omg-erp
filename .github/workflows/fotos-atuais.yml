name: Fotos - conferir fotos atuais
on: workflow_dispatch
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - run: python3 tools/fotos/atuais.py
      - run: |
          git config user.name "robo-omg"; git config user.email "robo@ohmygirl.com.br"
          git add tools/fotos/atuais tools/fotos/atuais_indice.json
          git commit -m "Fotos: folhas das fotos atuais" && git pull --rebase && git push || echo nada
