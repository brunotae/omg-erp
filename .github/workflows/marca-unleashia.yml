name: Marca Unleashia - ler loja oficial e referencias
on:
  push:
    branches: [main]
    paths: ['tools/marcas/unleashia/ler.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/marcas/unleashia/ler.py
      - run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/marcas/unleashia/dados
          git commit -qm "Unleashia: catalogo da loja oficial" || true
          git pull --rebase origin main && git push
