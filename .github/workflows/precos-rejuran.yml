name: Precos - Rejuran (loja EUA)
on:
  push:
    branches: [main]
    paths: ['tools/precos/ext/rejuran.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/precos/ext/rejuran.py
      - run: |
          git config user.name "omg-bot"; git config user.email "bot@ohmygirl.com.br"
          git add tools/precos/ext/dados
          git commit -m "Rejuran: catalogo EUA" || true
          git pull --rebase origin main && git push
