<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OMG ERP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF9F6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-v2.png">
<title>OMG! ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: menu com faixa bojagi | painel central | coluna de alertas. Manual de Identidade OMG v1.2: creme 60%, rosa 25%, ameixa 10%, menta 5%. Tema claro único, de propósito. */
:root{
  --bg:#FFF9F6; --surface:#FFFFFF; --surface2:#FFF3F6; --ink:#4A2638; --muted:#7A5566; --line:#F6E2E9;
  --chiclete:#F48FB1; --framboesa:#D9577F; --menta:#9EDFC4; --menta-bg:#E4F7EF; --salvia:#3D7D66; --bebe:#FDE4EC;
  --pri:#B83D66; --on-pri:#FFFFFF; --baby:#FFF0F5; --soft:#FDE4EC; --rasp:#D9577F; --accent:#B83D66; --mint:#E4F7EF; --sage:#3D7D66;
  --ok:#2F7A5E; --ok-bg:#E4F7EF; --warn:#95600C; --warn-bg:#FFF3DF; --bad:#B5303B; --bad-bg:#FDE8EC; --info:#B83D66; --info-bg:#FFF0F5; --mute-bg:#F7EEF1;
  --shadow:0 6px 18px rgba(74,38,56,.05); --shade:rgba(74,38,56,.30);
  --f-display:"Poppins","Noto Sans KR",system-ui,sans-serif;
  --f-text:"Poppins","Noto Sans KR",system-ui,sans-serif;
  --r:20px; --r-sm:12px; --pill:999px;
  color-scheme:light;
}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
/* login */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.gate .box{width:min(400px,100%);background:var(--surface);border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.gate .wm{display:flex;align-items:flex-start;gap:2px}
.gate .wm b{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1;color:var(--chiclete)}
.gate .wm svg{width:16px;height:16px;fill:var(--chiclete)}
.gate .tg{font-size:12px;letter-spacing:.42em;color:var(--framboesa);font-weight:300;margin-top:-6px}
.gate p{margin:0;color:var(--muted);font-size:13px}
.gate .f input{font-size:16px}
.gate .row{display:flex;gap:8px;flex-wrap:wrap}
.gate .row .btn{flex:1;justify-content:center;min-height:44px}
.gate .msg{font-size:13px;color:var(--bad);min-height:18px}
.gate .msg.ok{color:var(--ok)}
.foot .me{display:flex;align-items:center;justify-content:space-between;gap:8px}
.foot .me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.15}
h2{font-size:15px;font-weight:700}
h3{font-size:13px;font-weight:700}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.brand{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--rasp)}
.brand small{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.nav button{white-space:nowrap;display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:12px;padding:8px 10px;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:600}
.nav .cnt{font-size:11px;font-weight:700;background:var(--surface2);color:var(--ink);border-radius:var(--pill);padding:1px 7px}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.conn{display:inline-flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.conn.on i{background:var(--ok)} .conn.off i{background:var(--bad)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:8px 14px;color:var(--muted)}
.search svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;color:var(--ink)}
.top .sp{flex:1}
.ro{font-size:11px;font-weight:700;border:1px dashed var(--warn);color:var(--warn);border-radius:var(--pill);padding:4px 10px;white-space:nowrap}

.page{padding:24px 28px 60px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.page.wide{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:66ch}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--pill);padding:9px 16px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.pri:hover{filter:brightness(1.04)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:var(--pri)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-mute{background:var(--mute-bg);color:var(--muted)}
.tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
button.kpi:hover{border-color:var(--pri)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,1.8vw,24px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hot{background:var(--baby);border-color:var(--pri)}

.tblwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tbody tr[data-edit]{cursor:pointer}
tbody tr[data-edit]:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
td b{font-weight:600}
td small{display:block;color:var(--muted);font-size:11px}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--accent);flex:none}
.iconbtn:hover{background:var(--soft);border-color:var(--pri)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

.prog{display:flex;flex-direction:column;gap:5px;min-width:190px}
.prog .t{display:flex;gap:2px}
.prog .t i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.prog .t i.d{background:var(--pri)}
.prog .t i.c{background:var(--rasp)}
.prog span{font-size:11px;color:var(--muted)}
.prog span b{color:var(--ink);font-weight:600}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12px}
.bar .t{height:10px;border-radius:var(--pill);background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--pri);border-radius:var(--pill)}
.bar .v{text-align:right;font-weight:600}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.accts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.acct{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0}
.acct .flag{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.acct dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12.5px}
.acct dt{color:var(--muted)} .acct dd{margin:0;text-align:right;font-weight:600}
.acct .big{font-family:var(--f-display);font-weight:700;font-size:20px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.flow b{color:var(--ink);background:var(--surface2);border-radius:8px;padding:4px 9px;font-weight:600}

.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pack{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.pack:hover{border-color:var(--pri);box-shadow:var(--shadow)}
.pack .vis{background:var(--baby);display:flex;align-items:center;justify-content:center;padding:18px;min-height:120px;position:relative}
.pack .vis svg{width:110px;height:auto}
.pack .vis .code{position:absolute;top:10px;left:12px;font-weight:700;font-size:12px;color:var(--accent)}
.pack .vis .pill{position:absolute;top:10px;right:10px}
.pack .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.pack h3{font-size:15px}
.pack .dims{font-size:12px;color:var(--muted)}
.meter{height:8px;border-radius:var(--pill);background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sage);border-radius:var(--pill)}
.meter.low i{background:var(--rasp)}
.stock{display:flex;justify-content:space-between;font-size:12px;align-items:baseline}
.stock b{font-family:var(--f-display);font-size:18px}

.alert{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:9px 0;border:0;border-bottom:1px solid var(--line);text-align:left;background:none;width:100%}
.alert:last-child{border-bottom:0}
.alert i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn)}
.alert.bad i{background:var(--bad)}
.alert b{display:block;font-size:13px;font-weight:600}
.alert small{display:block;font-size:11px;color:var(--muted)}
.note{background:var(--baby);border:1px solid var(--soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.note p{margin:0}
.note .grid{display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.note .grid b{text-align:right}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.empty b{color:var(--ink);font-size:15px}
.empty p{margin:0;max-width:48ch}
pre.code{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;overflow:auto;font-size:12px;line-height:1.5;margin:0;max-height:360px}

/* modal */
.ov{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:20px;width:min(760px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal form{display:flex;flex-direction:column;gap:18px;padding:18px 20px}
.sec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.sec>.label{grid-column:1/-1;padding-top:4px;border-top:1px solid var(--line);padding-top:14px}
.sec:first-child>.label{border-top:0;padding-top:0}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea,.items input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:9px 11px;outline:0;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus,.items input:focus{border-color:var(--rasp)}
.f input[readonly]{background:var(--surface2)}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:11px;color:var(--muted)}
.anx{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
.anx-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 12px;background:var(--bg)}
.anx-it{display:grid;grid-template-columns:auto minmax(0,1fr) auto 32px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.anx-it:last-child{border-bottom:0}
.anx-it a,.anx-it>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.anx-it a{color:var(--accent);font-weight:600}
.anx-it small{color:var(--muted);font-size:11px;white-space:nowrap}
.anx-it.pend{opacity:.75}
.anx-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.anx-add select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:8px 10px;min-height:40px;min-width:0;flex:1 1 180px}
.anx-add label.btn{cursor:pointer;min-height:40px}
.drop{border:1.5px dashed var(--chiclete);border-radius:var(--r-sm);padding:14px;text-align:center;font-size:12.5px;color:var(--muted);background:var(--surface)}
.anx.over .drop{background:var(--bebe);color:var(--pri);border-style:solid;font-weight:600}
.anx.over .anx-list{border-color:var(--chiclete)}
@media (hover:none){.drop{display:none}}
#anx-sug{display:flex;flex-direction:column;gap:6px}
#anx-sug:empty{display:none}
.sug{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--menta-bg);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px}
.sug small{display:block;color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.sug>span:first-child{min-width:0;flex:1 1 220px}
.sug-b{display:flex;gap:6px;flex-wrap:wrap}
.sug.muted{background:var(--surface2)}
.sug.ok{background:var(--bebe)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:780px){.vlist label{grid-template-columns:20px minmax(0,1fr)}.vlist label>span{grid-column:2}.anx-it{grid-template-columns:minmax(0,1fr) auto 32px}.anx-it .tag{grid-column:1/-1;justify-self:start}}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.items{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.items .row{display:grid;grid-template-columns:minmax(0,2.2fr) 64px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 32px;gap:6px;align-items:center}
.items .row.h{font-size:11px;font-weight:600;color:var(--muted)}
.items input{padding:7px 9px}
.sum{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--surface2);border-radius:var(--r-sm);padding:12px}
.sum div{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.sum b{font-size:15px;color:var(--ink);font-family:var(--f-display)}
.stepgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.stepg{display:grid;grid-template-columns:22px minmax(0,1fr) 140px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.stepg .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.stepg.on .n{background:var(--pri);color:var(--on-pri)}
.stepg input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 7px;width:100%;min-width:0}
.stepg .who{font-size:10.5px;color:var(--muted);display:block}
.vlist{grid-column:1/-1;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px}
.vlist label{display:grid;grid-template-columns:20px 120px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.vlist label:last-child{border-bottom:0}
.mf{display:flex;justify-content:space-between;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--bad);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--pill);font-weight:600;font-size:13px;z-index:60;box-shadow:var(--shadow)}

<script>
(function(){
/* ================= domínio ================= */
const STEPS=[
 ['pago','Pago · impostos recolhidos','Cliente'],
 ['docs','Etiqueta e invoice gerados','Mile'],
 ['skyroad','Documentos enviados à Skyroad','OMG'],
 ['separado','Mercadoria separada','Janice / fábricas'],
 ['embalado','Embalado e etiquetado','Skyroad'],
 ['consolidado','Consolidado na caixa master','Skyroad'],
 ['awb','Despacho de exportação e AWB','Skyroad'],
 ['rfkr','Liberado pela Receita da Coreia','RF Coreia'],
 ['embarcado','Embarcado · saiu da Coreia','Cia aérea'],
 ['manifesto','Manifesto com AWB enviado à Mile','OMG'],
 ['desembaraco','Desembaraço no Brasil','Mile'],
 ['lastmile','Em rota · last mile','Mile'],
 ['entregue','Entregue','Mile']];
const SK=STEPS.map(s=>s[0]);
const LOTE_STEPS=['consolidado','awb','rfkr','embarcado','manifesto','desembaraco'];
const GROUPS=[['Pagas, aguardando Coreia',0,2],['Na Coreia (Skyroad)',3,7],['Em voo',8,9],['No Brasil (Mile)',10,11],['Entregues',12,12]];
const UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const BRANDS=['Anua','Beauty of Joseon','Celimax','COSRX',"d'Alba",'Dr. Althea','Dr. Jart+','Elizavecca','Laneige','Medicube','Missha','Numbuzin','Purito','Round Lab','Seoul 1988 (K-Secret)','SKIN1004','TIRTIR','Tocobo','Torriden','VT Cosmetics','Outra'];
const CATS=['Limpeza','Tônico','Sérum / Essência','Hidratante','Protetor solar','Máscara','Olhos e lábios','Maquiagem','Corpo e cabelo','Outro'];
const LANC_CAT=['Remessa para La Belle / Janice','Recebimento de clientes','Pagamento Mile (frete e last mile)','Marketing e influencers','Embalagens e gráfica','Mercadoria (La Belle / Coreia)','3PL Skyroad','Frete aéreo','Remessa EUA → Coreia','Tarifas bancárias e câmbio','Equipe e serviços Brasil','Outros'];
const CONTA_LB='La Belle · Janice (₩)';
const CONTAS=['Bank of America (US$)','PayPal (US$)','Brasil (R$)',CONTA_LB];
const REM_CATS=['Remessa para La Belle / Janice','Remessa EUA → Coreia'];
const CIAS=['Korean Air','Qatar Airways','Emirates','Turkish Airlines','Lufthansa','Cargolux','LATAM'];
function contasList(){
 const base=[...new Set([...CONTAS,...(Array.isArray(S.cfg.contas)?S.cfg.contas:[]).filter(c=>c!=='Coreia (₩)'||S.data.lancamentos.some(l=>l.conta===c))])];
 const extra=S.data.lancamentos.map(l=>l.conta).filter(c=>c&&!base.includes(c));
 return [...base,...new Set(extra)];
}
const MOEDAS=['BRL','USD','KRW'];

const S={db:null,canWrite:true,status:'connecting',view:'painel',q:'',
 data:{vendas:[],lotes:[],lancamentos:[],devolucoes:[],insumos:[],compras:[],produtos:[],cupons:[],fornecedores:[],metricas:[]},
 loaded:{},cfg:{krw:0.0039,usd:5.40,desc:12,markup:40,fielMin:2},
 f:{vendas:'abertas',fin:'mes'}};

const ICONS={
 painel:'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/>',
 vendas:'<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
 lotes:'<path d="M2 16 22 7l-3 9-6-1-3 5-1-6z"/>',
 financeiro:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
 lucro:'<path d="M4 19h16"/><path d="M6 15l4-4 3 3 5-6"/><path d="M15 8h3v3"/>',
 devolucoes:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
 insumos:'<path d="m3 8 9-5 9 5-9 5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
 compras:'<path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h6"/>',
 produtos:'<rect x="8" y="3" width="8" height="5" rx="1"/><path d="M7 8h10v12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z"/>',
 clientes:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 11h5M18.5 8.5v5"/>',
 analises:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 fornecedores:'<path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/>',
 config:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>'
};
const NAV=[['','painel','Painel'],['Operação','vendas','Vendas'],['','lotes','Embarques'],['','devolucoes','Devoluções'],['Dinheiro','financeiro','Financeiro'],['','lucro','Lucratividade'],['Estoque e compras','insumos','Embalagens'],['','compras','Compras'],['','produtos','Catálogo'],['Clientes','clientes','Clientes e cupons'],['','analises','Análises'],['Cadastros','fornecedores','Fornecedores'],['','config','Ajustes e integração']];

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>(typeof v==='number'&&isFinite(v))?v:0;
const has=v=>typeof v==='number'&&isFinite(v);
const brl=v=>has(v)?v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const krw=v=>has(v)?'₩ '+Math.round(v).toLocaleString('pt-BR'):'—';
const usd=v=>has(v)?'US$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const money=(v,m)=>m==='KRW'?krw(v):m==='USD'?usd(v):brl(v);
const toBRL=(v,m)=>m==='KRW'?n(v)*n(S.cfg.krw):m==='USD'?n(v)*n(S.cfg.usd):n(v);
const pct=v=>has(v)&&isFinite(v)?(v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—';
const vnum=v=>has(v)?v.toLocaleString('pt-BR'):'—';
const fdate=d=>{if(!d)return'—';const p=String(d).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0].slice(2):esc(d)};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysSince=d=>d?Math.floor((Date.parse(today())-Date.parse(d))/864e5):0;
const svg=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k]+'</svg>';
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
const match=row=>!S.q||JSON.stringify(row).toLowerCase().includes(S.q.toLowerCase());
const PILL={'Entregue':'p-ok','Recebida':'p-ok','Em estoque':'p-ok','Resolvida':'p-ok','Pago':'p-ok','Ativo':'p-ok','Concluído':'p-ok','Cancelada':'p-mute','Inativo':'p-mute','Cotação':'p-warn','Previsto':'p-warn','Aberta':'p-warn','Indefinido':'p-bad','Arte pronta':'p-info','Em cotação':'p-warn'};
const stPill=s=>'<span class="pill '+(PILL[s]||'p-info')+'">'+esc(s||'—')+'</span>';
function nextSeq(col,prefix,pad){let max=0;S.data[col].forEach(r=>{const m=String(r.numero||'').match(/(\d+)$/);if(m)max=Math.max(max,+m[1])});return prefix+String(max+1).padStart(pad,'0')}
const nextVenda=()=>{let max=100000000;S.data.vendas.forEach(v=>{if(has(v.numero))max=Math.max(max,v.numero)});return max+1};
const findV=num=>S.data.vendas.find(v=>String(v.numero)===String(num).replace(/\D/g,''));

/* ================= cálculos ================= */
function curStep(v){let c=-1;const e=v.etapas||{};SK.forEach((k,i)=>{if(e[k])c=i});return c}
const isCancel=v=>v.cancelada===true;
const isOpen=v=>!isCancel(v)&&curStep(v)<12;
function loteOf(v){return v.lote?S.data.lotes.find(l=>l.id===v.lote):null}
function calc(v){
 const it=Array.isArray(v.itens)?v.itens:[];
 const sub=it.reduce((a,i)=>a+n(i.qtd)*n(i.preco),0);
 const total=sub-n(v.desconto)+n(v.frete)+n(v.ii)+n(v.icms);
 const impostos=n(v.ii)+n(v.icms);
 const liquido=total-impostos;
 const lbK=it.reduce((a,i)=>a+n(i.qtd)*n(i.custoLB),0);
 const fabK=it.reduce((a,i)=>a+n(i.qtd)*n(i.custoFab),0);
 const L=loteOf(v);
 const rateioK=L?(n(L.custo3PL)+n(L.freteAereo)+n(L.despacho))/Math.max(1,(L.vendas||[]).length):0;
 const extraK=n(v.custo3PL);
 const emb=v.caixa?n((S.data.insumos.find(i=>i.codigo===v.caixa)||{}).custoUnit):0;
 const selo=v.caixa?n((S.data.insumos.find(i=>i.tipo==='Selo / adesivo')||{}).custoUnit):0;
 const k=n(S.cfg.krw);
 const custos=(lbK+rateioK+extraK)*k+n(v.custoMile)+emb+selo+n(v.outrosCustos);
 const margem=liquido-custos;
 return {sub,total,impostos,liquido,lbK,fabK,janiceK:lbK-fabK,rateioK,extraK,coreiaK:lbK+rateioK+extraK,emb:emb+selo,custos,margem,mPct:liquido?margem/liquido:null,qtd:it.reduce((a,i)=>a+n(i.qtd),0)};
}
const inMonth=(d,ym)=>String(d||'').startsWith(ym);
const ymNow=()=>today().slice(0,7);
let CUR='USD';try{CUR=localStorage.getItem('omg-moeda')==='BRL'?'BRL':'USD'}catch(_){}
const dm=v=>!has(v)?'—':CUR==='USD'?usd(v/(n(S.cfg.usd)||1)):brl(v);
const toKRW=(v,m)=>m==='KRW'?n(v):toBRL(v,m)/(n(S.cfg.krw)||1);
const pagoPelaJanice=l=>String(l.pagoPor||'Saldo La Belle (Janice)').startsWith('Saldo La Belle');
function loteRes(l){
 const vs=(l.vendas||[]).map(id=>S.data.vendas.find(v=>v.id===id)).filter(v=>v&&!isCancel(v));
 const k=n(S.cfg.krw);let rec=0,liq=0,imp=0,mile=0,emb=0,itensK=0,extraK=0,outros=0;
 vs.forEach(v=>{const c=calc(v);rec+=c.total;liq+=c.liquido;imp+=c.impostos;mile+=n(v.custoMile);emb+=c.emb;itensK+=c.lbK;extraK+=c.extraK;outros+=n(v.outrosCustos)});
 const mercK=has(l.custoMercadoria)?l.custoMercadoria:itensK;
 const logK=n(l.custo3PL)+n(l.freteAereo)+n(l.despacho)+extraK;
 const custo=(mercK+logK)*k+mile+emb+outros;
 return {vs,rec,liq,imp,mercK,logK,coreiaK:mercK+logK,mile,emb,outros,custo,res:liq-custo,mg:liq?(liq-custo)/liq:null};
}
function janice(){
 const mov=[];
 S.data.lancamentos.filter(l=>l.status==='Pago'&&REM_CATS.includes(l.categoria)).forEach(l=>mov.push({data:l.data,desc:l.descricao||'Remessa',ref:(l.conta||'')+' · '+money(l.valor,l.moeda)+(has(l.valorDestino)?'':' · ₩ pelo câmbio'),k:has(l.valorDestino)?l.valorDestino:toKRW(l.valor,l.moeda),tipo:'Remessa',edit:['lancamentos',l.id]}));
 S.data.lancamentos.filter(l=>l.status==='Pago'&&l.conta===CONTA_LB&&!REM_CATS.includes(l.categoria)).forEach(l=>{const k=toKRW(l.valor,l.moeda);mov.push({data:l.data,desc:l.descricao||l.categoria,ref:l.categoria,k:l.tipo==='Entrada'?k:-k,tipo:'Despesa',edit:['lancamentos',l.id]})});
 S.data.lotes.filter(pagoPelaJanice).forEach(l=>{const r=loteRes(l);if(!r.coreiaK)return;const e=l.etapas||{};
  mov.push({data:e.embarcado||e.consolidado||e.awb||String(l.criado_em||'').slice(0,10),desc:'Embarque '+l.numero,ref:'mercadoria '+krw(r.mercK)+' · logística '+krw(r.logK),k:-r.coreiaK,tipo:'Embarque',edit:['lotes',l.id]})});
 mov.sort((a,b)=>String(a.data).localeCompare(String(b.data)));

 const despKR=L.filter(l=>l.tipo==='Saída'&&l.status==='Pago'&&l.conta==='Coreia (₩)').reduce((a,l)=>a+toBRL(l.valor,l.moeda),0);

}

 return '<div class="page wide"><div class="col">'+head('Lucratividade','Margem da OMG por venda e o lucro da Janice na Coreia. Custos em won convertidos pelo câmbio de Ajustes.')+

  S.data.lotes.map(l=>{const R=loteRes(l);return '<tr data-edit="lotes" data-id="'+esc(l.id)+'"><td><b>'+esc(l.numero)+'</b><small>'+esc(l.awb||'')+'</small></td><td class="r num">'+R.vs.length+'</td><td class="r num">'+dm(R.liq)+'</td><td class="r num">'+dm(R.mercK*n(S.cfg.krw))+'<small>'+krw(R.mercK)+'</small></td><td class="r num">'+dm(R.logK*n(S.cfg.krw))+'<small>'+krw(R.logK)+'</small></td><td class="r num">'+dm(R.mile+R.emb+R.outros)+'</td><td class="r num"><b style="color:var(--'+(R.res>=0?'ok':'bad')+')">'+dm(R.res)+'</b><small>'+pct(R.mg)+'</small></td></tr>'}).join('')+'</tbody></table></div></div>':'')+

/* ---------- Clientes e cupons ---------- */
function clientes(){
 const m=new Map();
 S.data.vendas.filter(v=>!isCancel(v)).forEach(v=>{const key=(v.cpf||'').replace(/\D/g,'')||String(v.cliente||'').trim().toLowerCase();if(!key)return;
  const c=m.get(key)||{nome:v.cliente,contato:v.contato,uf:v.uf,cidade:v.cidade,n:0,total:0,ult:''};c.n++;c.total+=calc(v).total;if(String(v.dataCompra)>c.ult)c.ult=v.dataCompra;m.set(key,c)});
 return [...m.values()].sort((a,b)=>b.total-a.total);
}

/* ---------- Análises ---------- */
VIEWFN.analises=()=>{
 const vs=S.data.vendas.filter(v=>!isCancel(v));
 const prod=new Map(),uf=new Map();
 vs.forEach(v=>{const c=calc(v);(v.itens||[]).forEach(i=>{const k=i.produto||'—';const p=prod.get(k)||{q:0,r:0};p.q+=n(i.qtd);p.r+=n(i.qtd)*n(i.preco);prod.set(k,p)});const u=v.uf||'—';const x=uf.get(u)||{q:0,r:0};x.q++;x.r+=c.total;uf.set(u,x)});
 const top=[...prod.entries()].sort((a,b)=>b[1].q-a[1].q).slice(0,10), mq=Math.max(1,...top.map(t=>t[1].q));
 const ufs=[...uf.entries()].sort((a,b)=>b[1].q-a[1].q).slice(0,10), mu=Math.max(1,...ufs.map(t=>t[1].q));
 const tk=vs.length?vs.reduce((a,v)=>a+calc(v).total,0)/vs.length:null;
 const M=S.data.metricas.slice().sort((a,b)=>String(b.semana).localeCompare(String(a.semana)));
 const last=M[0]||{};
 const abandono=has(last.carrinhos)&&last.carrinhos>0?1-n(last.pedidos)/last.carrinhos:null;
 const conv=has(last.visitas)&&last.visitas>0?n(last.pedidos)/last.visitas:null;
 return '<div class="page wide"><div class="col">'+head('Análises','O que mais vende, para onde vai e quantos desistem no site. Funil lançado à mão por semana até a integração com o site.',newBtn('metricas','Lançar semana do site'))+
 '<div class="kpis">'+kpi('Ticket médio',tk!==null?dm(tk):'—',vs.length+' vendas')+kpi('Abandono de carrinho',pct(abandono),last.semana?'Semana de '+fdate(last.semana):'Sem dados do site',null,abandono!==null&&abandono>0.7)+kpi('Conversão do site',pct(conv),'Pedidos ÷ visitas')+kpi('Estados atendidos',uf.size,'Com ao menos 1 venda')+'</div>'+
 '<div class="two"><div class="card"><div class="card-h"><h2>Mais vendidos</h2><span class="label">unidades</span></div>'+(top.length?'<div class="bars">'+top.map(([k,p])=>'<div class="bar"><span title="'+esc(k)+'">'+esc(k)+'</span><span class="t"><i style="width:'+(p.q/mq*100)+'%"></i></span><span class="v num">'+p.q+'</span></div>').join('')+'</div>':'<p class="muted" style="margin:0">Aparece com as primeiras vendas.</p>')+'</div>'+
 '<div class="card"><div class="card-h"><h2>Para onde vai</h2><span class="label">vendas por UF</span></div>'+(ufs.length?'<div class="bars">'+ufs.map(([k,p])=>'<div class="bar"><span>'+esc(k)+' · '+dm(p.r)+'</span><span class="t"><i style="width:'+(p.q/mu*100)+'%"></i></span><span class="v num">'+p.q+'</span></div>').join('')+'</div>':'<p class="muted" style="margin:0">Aparece com as primeiras vendas.</p>')+'</div></div>'+
 '<div class="card"><div class="card-h"><h2>Funil do site por semana</h2></div>'+(M.length?'<div class="tblwrap"><table><thead><tr><th>Semana</th><th class="r">Visitas</th><th class="r">Carrinhos</th><th class="r">Checkout iniciado</th><th class="r">Pedidos</th><th class="r">Abandono</th><th class="r">Conversão</th></tr></thead><tbody>'+
  M.map(m=>'<tr data-edit="metricas" data-id="'+esc(m.id)+'"><td class="num">'+fdate(m.semana)+'</td><td class="r num">'+vnum(m.visitas)+'</td><td class="r num">'+vnum(m.carrinhos)+'</td><td class="r num">'+vnum(m.checkouts)+'</td><td class="r num">'+vnum(m.pedidos)+'</td><td class="r num">'+pct(n(m.carrinhos)?1-n(m.pedidos)/m.carrinhos:null)+'</td><td class="r num">'+pct(n(m.visitas)?n(m.pedidos)/m.visitas:null)+'</td></tr>').join('')+'</tbody></table></div>'
  :empty('Sem dados do site','Lance visitas, carrinhos, checkouts e pedidos da semana (do painel do site ou do Google Analytics). Depois da integração, isso entra sozinho.'))+'</div></div></div>';
};

function fieldHTML(f,v,ro){
 const id='f-'+f.k, opts=typeof f.o==='function'?f.o():f.o;
 if(f.t==='bool')return '<label class="chk'+(f.full?' full':'')+'" style="padding-top:22px"><input type="checkbox" id="'+id+'" name="'+f.k+'"'+(v?' checked':'')+(ro?' disabled':'')+'> '+esc(f.l)+'</label>';
 let inp;
 if(f.t==='select'){const list=v==null||v===''||opts.includes(v)?opts:[...opts,v];inp='<select id="'+id+'" name="'+f.k+'"'+(ro?' disabled':'')+'>'+list.map(o=>'<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(o||'—')+'</option>').join('')+'</select>'}
 else if(f.t==='combo'){
  const val=v==null?'':String(v), known=val===''||opts.includes(val), sel=known?val:'__outra';
  inp='<select id="'+id+'" name="'+f.k+'" data-combo'+(ro?' disabled':'')+'>'+['',...opts].map(o=>'<option value="'+esc(o)+'"'+(o===sel?' selected':'')+'>'+esc(o||'—')+'</option>').join('')+
   '<option value="__outra"'+(sel==='__outra'?' selected':'')+'>Outra…</option></select>'+
   '<input id="'+id+'-outra" name="'+f.k+'__outra" type="text" aria-label="'+esc(f.l)+': outra" placeholder="Escreva o nome" value="'+esc(known?'':val)+'"'+(sel==='__outra'?'':' hidden')+(ro?' readonly':'')+' style="margin-top:6px">';
 }
 else if(f.t==='textarea')inp='<textarea id="'+id+'" name="'+f.k+'"'+(ro?' readonly':'')+'>'+esc(v)+'</textarea>';
 else inp='<input id="'+id+'" name="'+f.k+'" type="'+(f.t==='number'?'number':f.t==='date'?'date':'text')+'"'+(f.t==='number'?' step="any"':'')+' value="'+esc(v??'')+'"'+(ro||f.ro?' readonly':'')+(f.list?' list="'+f.list+'"':'')+'>';
 return '<div class="f'+(f.full?' full':'')+'"><label for="'+id+'">'+esc(f.l)+'</label>'+inp+(f.hint?'<span class="hint">'+esc(f.hint)+'</span>':'')+'</div>';
}
function readFields(form,fs){
 const vals={};
 for(const f of fs){const el=form.elements[f.k];if(!el)continue;
  if(f.t==='bool')vals[f.k]=el.checked;
  else if(f.t==='number'){const x=el.value.trim();vals[f.k]=x===''?null:parseFloat(x.replace(',','.'))}
  else if(f.t==='combo'){vals[f.k]=el.value==='__outra'?((form.elements[f.k+'__outra']||{}).value||'').trim():el.value.trim()}
  else vals[f.k]=el.value.trim();
  if(f.req&&(vals[f.k]===''||vals[f.k]==null))throw {field:f};
 }
 return vals;
}

  del.disabled=true;try{await dbDelete(col,rec.id);const ps=(rec.anexos||[]).map(a=>a.path).filter(Boolean);if(ps.length){try{await sb.storage.from('docs').remove(ps)}catch(_){}}close();toast('Excluído');loadAll()}catch(e){$('#m-err').textContent=errMsg(e);del.disabled=false}});

function loadPdfjs(){
 if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
 if(!pdfjsP)pdfjsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFJS;
  s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS.replace('pdf.min.js','pdf.worker.min.js')}catch(_){}res(window.pdfjsLib)};
  s.onerror=()=>{pdfjsP=null;rej(new Error('pdfjs'))};document.head.appendChild(s)});
 return pdfjsP;

async function pdfLines(file){
 const lib=await loadPdfjs();
 const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
 const out=[];
 for(let p=1;p<=Math.min(doc.numPages,6);p++){
  const pg=await doc.getPage(p),tc=await pg.getTextContent(),rows=[];
  tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,its:[]};rows.push(r)}r.its.push(it)});
  rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.its.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()));
 }
 return out;
}
function parseNum(t){
 t=t.replace(/[.,]+$/,'');
 if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t))return +t.replace(/,/g,'');
 if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))return +t.replace(/\./g,'').replace(',','.');
 if(/^\d+,\d{1,2}$/.test(t))return +t.replace(',','.');
 return +t.replace(/,/g,'');
}
function curOf(s){
 if(/R\$|\bBRL\b|reais/i.test(s))return 'BRL';
 if(/\bKRW\b|₩|\bWON\b|원/i.test(s))return 'KRW';
 if(/US\$|\bUSD\b|\$/i.test(s))return 'USD';
 return null;
}
function findTotal(lines){
 const KW=[[/grand\s*total|total\s*amount\s*due|amount\s*due|total\s*due|balance\s*due|total\s*a\s*pagar|valor\s*total|총\s*청구\s*금액|청구\s*금액|총\s*금액|총\s*액|합\s*계\s*금\s*액/i,3],
  [/\btotal\b|invoice\s*amount|합\s*계/i,2],[/amount|valor|금\s*액/i,1]];
 const SKIP=/sub\s*-?\s*total|소\s*계|tax\s*id|vat\s*no|qty|quantity|weight|kg\b|phone|tel\b|fax|zip|account\s*(no|number)|swift|iban|invoice\s*(no|number|#)|page\s*\d/i;
 const doc=lines.join(' ');let best=null;
 lines.forEach((ln,i)=>{
  if(SKIP.test(ln))return;
  let pr=0;for(const [re,p] of KW)if(re.test(ln)){pr=p;break}
  if(!pr)return;
  let src=ln,nums=(ln.match(/\d[\d.,]*\d|\d/g)||[]).map(parseNum).filter(v=>v>0);
  if(!nums.length&&lines[i+1]){src=ln+' '+lines[i+1];nums=(lines[i+1].match(/\d[\d.,]*\d|\d/g)||[]).map(parseNum).filter(v=>v>0)}
  if(!nums.length)return;
  const val=nums[nums.length-1];
  if(val<1||(val>=1900&&val<=2100&&Number.isInteger(val)&&nums.length===1&&!/[.,]/.test(src.slice(-8))))return;
  const cand={val,cur:curOf(src),pr,i,line:src};
  if(!best||cand.pr>best.pr||(cand.pr===best.pr&&(cand.i>best.i||cand.val>best.val)))best=cand;
 });
 if(best&&!best.cur){const c={KRW:(doc.match(/KRW|₩|원/gi)||[]).length,USD:(doc.match(/USD|US\$|\$/gi)||[]).length,BRL:(doc.match(/R\$|BRL/gi)||[]).length};
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];best.cur=top[1]?top[0]:null}
 return best;
}

 const ro=!can();
 const x='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
 const rows=[...AX.keep.filter(a=>!AX.remove.has(a.path)).map(a=>({...a,st:'ok'})),...AX.pending.map((p,i)=>({nome:p.file.name,tipo:p.tipo,size:p.file.size,st:'pend',i}))];
 el.innerHTML=rows.length?rows.map(a=>'<div class="anx-it'+(a.st==='pend'?' pend':'')+'"><span class="tag">'+esc(a.tipo)+'</span>'+
  (a.st==='ok'&&AX.urls[a.path]?'<a href="'+esc(AX.urls[a.path])+'" target="_blank" rel="noopener">'+esc(a.nome)+'</a>':'<span>'+esc(a.nome)+'</span>')+
  '<small>'+(a.st==='pend'?'a enviar · ':'')+fmtSize(a.size)+'</small>'+
  (ro?'<span></span>':'<button class="iconbtn" type="button" data-anx-rm="'+(a.st==='ok'?'p:'+esc(a.path):'n:'+a.i)+'" aria-label="Remover '+esc(a.nome)+'">'+x+'</button>')+'</div>').join('')
  :'<p class="muted" style="margin:6px 0;font-size:12.5px">Nenhum documento anexado.</p>';
}
function wireAnexos(col,rec){
 if(!ANX[col]){AX=null;return}
 AX={col,keep:Array.isArray(rec&&rec.anexos)?rec.anexos.slice():[],pending:[],remove:new Set(),urls:{}};
 renderAnx();
 const paths=AX.keep.map(a=>a.path).filter(Boolean);
 if(paths.length){
  const mine=AX;
  sb.storage.from('docs').createSignedUrls(paths,3600).then(({data})=>{if(AX!==mine)return;(data||[]).forEach(d=>{if(d&&d.signedUrl&&d.path)AX.urls[d.path]=d.signedUrl});renderAnx()}).catch(()=>{});
 }
 renderSug();
 const inp=$('#anx-file');
 if(inp)inp.addEventListener('change',()=>{addFiles(inp.files);inp.value=''});
 // arrastar e soltar: em qualquer ponto do formulário
 const ov=$('#ov'),zone=$('#anx');
 if(ov&&zone&&can()){
  let depth=0;
  const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
  ov.addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();depth++;zone.classList.add('over');zone.scrollIntoView({block:'nearest',behavior:'smooth'})});
  ov.addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy'});
  ov.addEventListener('dragleave',e=>{if(!hasFiles(e))return;depth=Math.max(0,depth-1);if(!depth)zone.classList.remove('over')});
  ov.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();depth=0;zone.classList.remove('over');addFiles(e.dataTransfer.files)});
 }
}
function addFiles(list){
 if(!AX||!can())return;
 const sel=$('#anx-tipo'),tipo=sel?sel.value:'Outro';let big=0;const novos=[];
 [...list].forEach(f=>{if(f.size>MAX_MB*1048576){big++;return}const p={file:f,tipo};AX.pending.push(p);novos.push(p)});
 renderAnx();
 if(big)toast(big+(big>1?' arquivos passam':' arquivo passa')+' de '+MAX_MB+' MB e não '+(big>1?'foram anexados':'foi anexado')+'.');
 else if(novos.length)toast(novos.length+(novos.length>1?' arquivos prontos':' arquivo pronto')+' para subir ao salvar');
 novos.forEach(scanPdf);
}
function anxRemove(key){
 if(!AX)return;
 if(key.startsWith('p:'))AX.remove.add(key.slice(2));else AX.pending.splice(Number(key.slice(2)),1);
 renderAnx();renderSug();
}
async function finishAnexos(col,id){
 if(!AX||AX.col!==col||!id)return;
 if(!AX.pending.length&&!AX.remove.size)return;
 const st=sb.storage.from('docs');const added=[];let falhou=null;
 for(const [i,p] of AX.pending.entries()){
  const path=col+'/'+id+'/'+Date.now()+'-'+i+'-'+safeName(p.file.name);
  const {error}=await st.upload(path,p.file,{contentType:p.file.type||undefined,upsert:false});
  if(error){falhou=error;break}
  added.push({path,nome:p.file.name,tipo:p.tipo,size:p.file.size,em:new Date().toISOString()});
 }
 if(AX.remove.size){try{await st.remove([...AX.remove])}catch(_){}}
 const anexos=[...AX.keep.filter(a=>!AX.remove.has(a.path)),...added];
 await sb.from(col).update({anexos}).eq('id',id);
 AX=null;
 if(falhou)toast(/bucket/i.test(falhou.message||'')?'Salvo, mas a pasta de documentos ainda não existe. Rode o SQL de documentos no Supabase.':'Salvo, mas '+(anexos.length?'alguns documentos':'os documentos')+' não subiram. Abra de novo e anexe outra vez.');
}

/* ================= gravação ================= */
async function save(col,rec,vals){
 const body=toDb(col,{...(rec||{}),...vals});
 if(rec){
  const {error}=await sb.from(col).update(body).eq('id',rec.id);
  if(error)throw error; return rec.id;
 }
 const {data,error}=await sb.from(col).insert(body).select('id').single();
 if(error)throw error; return data.id;
}
async function dbDelete(col,id){const {error}=await sb.from(col).delete().eq('id',id);if(error)throw error}
async function advance(id){
 const v=S.data.vendas.find(x=>x.id===id);if(!v)return;const c=curStep(v);if(c>=12)return;
 const k=SK[c+1];
 try{await save('vendas',v,{etapas:{...(v.etapas||{}),[k]:today()}});toast(vnum(v.numero)+': '+STEPS[c+1][1]);await loadAll()}catch(e){toast(errMsg(e))}
}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
 if(e.target.id==='ov'){close();return}
 const t=e.target.closest('button,tr[data-edit],[data-edit]');if(!t)return;
 if(t.matches('[data-close]')){close();return}
 if(t.dataset.cur){CUR=t.dataset.cur;try{localStorage.setItem('omg-moeda',CUR)}catch(_){}render();return}
 if(t.dataset.anxRm){anxRemove(t.dataset.anxRm);return}
 if(t.dataset.sug){useSug(t.dataset.sug);return}
 if(t.dataset.adv){e.stopPropagation();advance(t.dataset.adv);return}
 if(t.dataset.view){S.view=t.dataset.view;S.q='';$('#q').value='';render();window.scrollTo(0,0);return}
 if(t.dataset.fv){S.f.vendas=t.dataset.fv;render();return}
 if(t.dataset.ff){S.f.fin=t.dataset.ff;render();return}
 if(t.dataset.new){openForm(t.dataset.new);return}
 if(t.dataset.edit&&!t.closest('#modal-root')){openForm(t.dataset.edit,t.dataset.id);return}
 if(t.id==='backup'){doBackup();return}
 if(t.id==='logout'||t.hasAttribute('data-logout')){sb.auth.signOut();return}
 if(t.id==='copy-schema'){const txt=$('#schema').textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents($('#schema'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto selecionado. Copie com Ctrl/Cmd + C')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Formato copiado'),sel)}catch(_){sel()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('change',e=>{
 const s=e.target;if(!s.matches||!s.matches('select[data-combo]'))return;
 const o=document.getElementById(s.id+'-outra');if(!o)return;
 o.hidden=s.value!=='__outra';if(!o.hidden)o.focus();
});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();render()},150)});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='cfg')return;e.preventDefault();
 const v=k=>{const x=parseFloat($('#c-'+k).value);return isFinite(x)?x:S.cfg[k]};
 const u=v('usd'),ku=parseFloat($('#c-krwUsd').value);
 const valor={krw:isFinite(ku)&&ku>0?u/ku:S.cfg.krw,usd:u,desc:v('desc'),markup:v('markup'),fielMin:v('fielMin'),contas:contasList()};
 const {error}=await sb.from('config').upsert({chave:'geral',valor});
 if(error)toast(errMsg(error));else{toast('Ajustes salvos');await loadAll()}
});
async function saveContas(list){
 const valor={krw:S.cfg.krw,usd:S.cfg.usd,desc:S.cfg.desc,markup:S.cfg.markup,fielMin:S.cfg.fielMin,contas:list};
 const {error}=await sb.from('config').upsert({chave:'geral',valor});
 if(error){toast(errMsg(error));return false}
 S.cfg.contas=list;return true;
}
document.addEventListener('click',async e=>{
 const add=e.target.closest('#conta-add'),rm=e.target.closest('[data-conta-rm]');
 if(add){const inp=$('#conta-nova'),nome=inp.value.trim();if(!nome)return;const list=contasList();if(list.includes(nome)){toast('Essa conta já existe');return}
  if(await saveContas([...list,nome])){toast('Conta adicionada');render()}}
 if(rm){const nome=rm.dataset.contaRm;if(S.data.lancamentos.some(l=>l.conta===nome)){toast('Essa conta tem lançamentos. Ela fica na lista.');return}
  if(await saveContas(contasList().filter(c=>c!==nome))){toast('Conta removida');render()}}
});

function doBackup(){
 const out={exportadoEm:new Date().toISOString(),ajustes:S.cfg};
 Object.keys(S.data).forEach(k=>out[k]=S.data[k]);
 const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='omg-erp-backup-'+today()+'.json';
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
 toast('Backup baixado');
}

/* ================= conexão e login ================= */
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'omg-erp-auth'}});
const ORD={insumos:'codigo',fornecedores:'nome',cupons:'codigo'};
let loadingNow=false;
async function loadAll(){
 if(loadingNow||!S.db)return;loadingNow=true;
 try{
  const cols=Object.keys(S.data);
  const res=await Promise.all([...cols.map(c=>sb.from(c).select('*')),sb.from('config').select('*').eq('chave','geral')]);
  let failed=false;
  cols.forEach((col,i)=>{const {data,error}=res[i];if(error){failed=true;return}
   S.data[col]=(data||[]).map(r=>fromDb(col,r)).sort((a,b)=>ORD[col]?String(a[ORD[col]]||'').localeCompare(String(b[ORD[col]]||'')):col==='vendas'?n(b.numero)-n(a.numero):n(b.createdAt)-n(a.createdAt));
   S.loaded[col]=true});
  const cfg=res[cols.length];if(cfg&&cfg.data&&cfg.data[0])S.cfg={...S.cfg,...cfg.data[0].valor};
  S.status=failed?'off':'on';
 }catch(_){S.status='off'}
 loadingNow=false;
 if(!document.querySelector('#ov'))render();else renderNav();
}
const gateMsg=(t,ok)=>{const m=$('#l-msg');m.textContent=t||'';m.classList.toggle('ok',!!ok)};
function showGate(text,signedIn){
 $('#app').hidden=true;$('#gate').hidden=false;
 $('#gate-text').textContent=text;
 ['l-email','l-senha'].forEach(id=>$('#'+id).closest('.f').hidden=signedIn);
 $('#l-entrar').closest('.row').hidden=signedIn;$('#l-sair').hidden=!signedIn;
}
async function enter(session){
 if(!session){S.db=null;showGate('Entre com seu e-mail e senha para abrir o ERP.',false);return}
 const email=String(session.user.email||'').toLowerCase();
 const {data,error}=await sb.from('membros').select('papel,nome').eq('email',email);
 if(error){showGate('Não foi possível conferir seu acesso agora. Verifique a conexão e abra o app de novo.',true);return}
 if(!data||!data.length){showGate('Sua conta ('+email+') foi criada, mas ainda não tem acesso ao ERP. Peça ao Tae para liberar.',true);return}
 S.canWrite=data[0].papel==='editor';S.db=sb;
 $('#me-email').textContent=email+(S.canWrite?'':' · consulta');
 $('#gate').hidden=true;$('#app').hidden=false;
 render();await loadAll();
}
$('#login-form').addEventListener('submit',async e=>{
 e.preventDefault();gateMsg('');
 const email=$('#l-email').value.trim(),senha=$('#l-senha').value;
 if(!email||!senha){gateMsg('Preencha e-mail e senha.');return}
 $('#l-entrar').disabled=true;
 const {error}=await sb.auth.signInWithPassword({email,password:senha});
 $('#l-entrar').disabled=false;
 if(error)gateMsg(/Invalid login/i.test(error.message)?'E-mail ou senha incorretos. Primeira vez? Toque em Criar conta.':/confirm/i.test(error.message)?'Confirme seu e-mail pelo link que chegou na sua caixa de entrada.':'Não foi possível entrar agora. Tente de novo.');
});
$('#l-criar').addEventListener('click',async()=>{
 gateMsg('');
 const email=$('#l-email').value.trim(),senha=$('#l-senha').value;
 if(!email||senha.length<6){gateMsg('Use seu e-mail e uma senha com pelo menos 6 caracteres.');return}
 $('#l-criar').disabled=true;
 const {data,error}=await sb.auth.signUp({email,password:senha});
 $('#l-criar').disabled=false;
 if(error){gateMsg(/registered|exists/i.test(error.message)?'Esse e-mail já tem conta. Toque em Entrar.':'Não foi possível criar a conta agora. Tente de novo.');return}
 if(!data.session)gateMsg('Conta criada. Confirme pelo link enviado ao seu e-mail e depois toque em Entrar.',true);
});
$('#l-sair').addEventListener('click',()=>sb.auth.signOut());
sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='INITIAL_SESSION')setTimeout(()=>enter(session),0)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadAll()});
setInterval(()=>{if(!document.hidden)loadAll()},60000);
})();
</script>
